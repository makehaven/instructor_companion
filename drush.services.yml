services:
  instructor_companion.badge_sync_commands:
    class: \Drupal\instructor_companion\Commands\CourseBadgeSyncCommands
    arguments:
      - '@instructor_companion.badge_sync'
    tags:
      - { name: drush.command }

  instructor_companion.template_audit_commands:
    class: \Drupal\instructor_companion\Commands\TemplateAuditCommands
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@file_system'
    tags:
      - { name: drush.command }

  instructor_companion.template_bulk_assign_commands:
    class: \Drupal\instructor_companion\Commands\TemplateBulkAssignCommands
    arguments:
      - '@entity_type.manager'
    tags:
      - { name: drush.command }

  instructor_companion.template_backfill_commands:
    class: \Drupal\instructor_companion\Commands\TemplateBackfillCommands
    arguments:
      - '@entity_type.manager'
      - '@database'
    tags:
      - { name: drush.command }

  instructor_companion.session_commands:
    class: \Drupal\instructor_companion\Commands\SessionCommands
    arguments:
      - '@instructor_companion.sessions'
      - '@instructor_companion.session_evaluation'
      - '@instructor_companion.attendance_manager'
    tags:
      - { name: drush.command }
  instructor_companion.follower_commands:
    class: \Drupal\instructor_companion\Commands\FollowerCommands
    arguments:
      - '@instructor_companion.course_follower_notifier'
      - '@state'
    tags:
      - { name: drush.command }
