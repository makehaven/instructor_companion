services:
  instructor_companion.stats_sync:
    class: Drupal\instructor_companion\CourseStatsSync

  instructor_companion.badge_sync:
    class: Drupal\instructor_companion\CourseBadgeSync
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@logger.channel.instructor_companion'

  instructor_companion.instructor_profile_resolver:
    class: Drupal\instructor_companion\Service\InstructorProfileResolver
    arguments:
      - '@entity_type.manager'

  instructor_companion.approval_gate:
    class: Drupal\instructor_companion\Service\InstructorApprovalGate
    arguments:
      - '@entity_type.manager'

  instructor_companion.door_access:
    class: Drupal\instructor_companion\Service\InstructorDoorAccess
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@logger.channel.instructor_companion'

  instructor_companion.post_event_status:
    class: Drupal\instructor_companion\Service\PostEventStatusService
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@state'
      - '@config.factory'

  instructor_companion.attendance_manager:
    class: Drupal\instructor_companion\Service\AttendanceManager
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@logger.channel.instructor_companion'

  instructor_companion.post_event_reminder:
    class: Drupal\instructor_companion\Service\PostEventReminderService
    arguments:
      - '@database'
      - '@state'
      - '@entity_type.manager'
      - '@instructor_companion.post_event_status'
      - '@plugin.manager.mail'
      - '@config.factory'
      - '@logger.channel.instructor_companion'

  instructor_companion.proposal_notifier:
    class: Drupal\instructor_companion\Service\ProposalNotifier
    arguments:
      - '@config.factory'
      - '@http_client'
      - '@logger.channel.instructor_companion'

  instructor_companion.proposal_hold_manager:
    class: Drupal\instructor_companion\Service\ProposalHoldManager
    arguments:
      - '@entity_type.manager'
      - '@state'
      - '@instructor_companion.approval_gate'
      - '@plugin.manager.mail'
      - '@config.factory'
      - '@logger.channel.instructor_companion'

  instructor_companion.stale_review_nudge:
    class: Drupal\instructor_companion\Service\StaleReviewNudge
    arguments:
      - '@database'
      - '@state'
      - '@plugin.manager.mail'
      - '@config.factory'
      - '@logger.channel.instructor_companion'

  instructor_companion.proposal_processor:
    class: Drupal\instructor_companion\Service\ProposalProcessor
    arguments:
      - '@entity_type.manager'
      - '@messenger'
      - '@logger.channel.instructor_companion'
      - '@config.factory'
      - '@plugin.manager.mail'
      - '@token'

  logger.channel.instructor_companion:
    parent: logger.channel_base
    arguments:
      - instructor_companion

  instructor_companion.agreement_access_subscriber:
    class: Drupal\instructor_companion\EventSubscriber\AgreementAccessSubscriber
    arguments:
      - '@current_route_match'
      - '@current_user'
      - '@entity_type.manager'
      - '@messenger'
    tags:
      - { name: event_subscriber }

  instructor_companion.proposal_deactivate_subscriber:
    class: Drupal\instructor_companion\EventSubscriber\ProposalDeactivateSubscriber
    arguments:
      - '@state'
      - '@database'
    tags:
      - { name: event_subscriber }

  instructor_companion.quiz_result_cta_subscriber:
    class: Drupal\instructor_companion\EventSubscriber\QuizResultCtaSubscriber
    arguments:
      - '@current_route_match'
      - '@current_user'
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }

  instructor_companion.post_workshop_redirect_subscriber:
    class: Drupal\instructor_companion\EventSubscriber\PostWorkshopRedirectSubscriber
    tags:
      - { name: event_subscriber }
