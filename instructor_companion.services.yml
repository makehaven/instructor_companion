services:
  instructor_companion.stats_sync:
    class: Drupal\instructor_companion\CourseStatsSync

  instructor_companion.badge_sync:
    class: Drupal\instructor_companion\CourseBadgeSync
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@logger.channel.instructor_companion'

  instructor_companion.instructor_profile_resolver:
    class: Drupal\instructor_companion\Service\InstructorProfileResolver
    arguments:
      - '@entity_type.manager'

  instructor_companion.proposal_notifier:
    class: Drupal\instructor_companion\Service\ProposalNotifier
    arguments:
      - '@config.factory'
      - '@http_client'
      - '@logger.channel.instructor_companion'
  logger.channel.instructor_companion:
    parent: logger.channel_base
    arguments:
      - instructor_companion

  instructor_companion.agreement_access_subscriber:
    class: Drupal\instructor_companion\EventSubscriber\AgreementAccessSubscriber
    arguments:
      - '@current_route_match'
      - '@current_user'
      - '@entity_type.manager'
      - '@messenger'
    tags:
      - { name: event_subscriber }

  instructor_companion.quiz_result_cta_subscriber:
    class: Drupal\instructor_companion\EventSubscriber\QuizResultCtaSubscriber
    arguments:
      - '@current_route_match'
      - '@current_user'
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }
