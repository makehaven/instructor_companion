instructor_companion.become_instructor:
  path: '/become-instructor'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\BecomeInstructorController::build'
    _title: 'Become a MakeHaven Instructor'
  requirements:
    _access: 'TRUE'

instructor_companion.course_picker:
  path: '/become-instructor/courses'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\CoursePickerController::build'
    _title: 'Workshops Available to Teach'
  requirements:
    _access: 'TRUE'
  options:
    _admin_route: TRUE

instructor_companion.prospective_instructors:
  path: '/admin/people/prospective-instructors'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\ProspectiveInstructorsController::build'
    _title: 'Prospective Instructors'
  requirements:
    _permission: 'access education console'

instructor_companion.grant_instructor_role:
  path: '/admin/people/prospective-instructors/grant/{user}'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\ProspectiveInstructorsController::grantRole'
  options:
    parameters:
      user:
        type: entity:user
  requirements:
    _permission: 'administer users'
    _csrf_token: 'TRUE'
    user: \d+

instructor_companion.grant_door_access:
  path: '/admin/people/prospective-instructors/grant-door/{user}'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\ProspectiveInstructorsController::grantDoorAccess'
  options:
    parameters:
      user:
        type: entity:user
  requirements:
    _permission: 'administer users'
    _csrf_token: 'TRUE'
    user: \d+

instructor_companion.proposal_review:
  path: '/admin/structure/proposals/{event_id}/review'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\ProposalReviewController::build'
    _title: 'Review Proposal'
  requirements:
    _permission: 'edit all events'
    event_id: '\d+'

instructor_companion.proposal_approve:
  path: '/admin/structure/proposals/{event_id}/approve'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\ProposalReviewController::approve'
    _title: 'Approve Proposal'
  requirements:
    _permission: 'edit all events'
    _csrf_token: 'TRUE'
    event_id: '\d+'

instructor_companion.proposal_deny:
  path: '/admin/structure/proposals/{event_id}/deny'
  defaults:
    _form: '\Drupal\instructor_companion\Form\ProposalDenyForm'
    _title: 'Deny or close proposal'
  requirements:
    _permission: 'edit all events'
    event_id: '\d+'

instructor_companion.dashboard:
  path: '/instructor/dashboard'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\InstructorDashboardController::build'
    _title: 'Instructor Dashboard'
  requirements:
    _permission: 'access instructor dashboard'
  options:
    _admin_route: TRUE

instructor_companion.class_checkout:
  path: '/instructor/class-checkout/{event_id}'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\ClassCheckoutController::build'
    _title: 'Class Checkout'
  requirements:
    _custom_access: '\Drupal\instructor_companion\Controller\ClassCheckoutController::access'
    event_id: '\d+'

instructor_companion.class_checkout_mark:
  path: '/instructor/class-checkout/{event_id}/mark/{user_id}/{badge_tid}'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\ClassCheckoutController::markComplete'
    _title: 'Mark Class Complete'
  requirements:
    _custom_access: '\Drupal\instructor_companion\Controller\ClassCheckoutController::access'
    _csrf_token: 'TRUE'
    event_id: '\d+'
    user_id: '\d+'
    badge_tid: '\d+'

instructor_companion.class_checkout_fail:
  path: '/instructor/class-checkout/{event_id}/fail/{user_id}/{badge_tid}'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\ClassCheckoutController::markNotPassed'
    _title: 'Class Checkout Not Passed'
  requirements:
    _custom_access: '\Drupal\instructor_companion\Controller\ClassCheckoutController::access'
    _csrf_token: 'TRUE'
    event_id: '\d+'
    user_id: '\d+'
    badge_tid: '\d+'

instructor_companion.post_event_hub:
  path: '/instructor/post-event/{event_id}'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\PostEventHubController::build'
    _title: 'Post-Class Tasks'
  requirements:
    _custom_access: '\Drupal\instructor_companion\Controller\ClassCheckoutController::access'
    event_id: '\d+'

instructor_companion.attendance:
  path: '/instructor/attendance/{event_id}'
  defaults:
    _form: '\Drupal\instructor_companion\Form\AttendanceForm'
    _title: 'Take Attendance'
  requirements:
    _custom_access: '\Drupal\instructor_companion\Controller\ClassCheckoutController::access'
    event_id: '\d+'

instructor_companion.settings:
  path: '/admin/config/makerspace/instructor-companion'
  defaults:
    _form: '\Drupal\instructor_companion\Form\SettingsForm'
    _title: 'Instructor Companion'
  requirements:
    _permission: 'administer site configuration'

instructor_companion.course_merge_form:
  path: '/admin/structure/courses/merge/{source_nid}'
  defaults:
    _form: '\Drupal\instructor_companion\Form\CourseMergeForm'
    _title: 'Merge Workshop'
  requirements:
    _permission: 'create civicrm_event entities'

instructor_companion.course_merge_execute:
  path: '/admin/structure/courses/merge/{source_nid}/{target_nid}'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\CourseMergeController::merge'
    _title: 'Merge Courses'
  requirements:
    _permission: 'create civicrm_event entities'

instructor_companion.event_reassign_form:
  path: '/admin/structure/courses/reassign-event/{event_id}'
  defaults:
    _form: '\Drupal\instructor_companion\Form\EventReassignForm'
    _title: 'Move Event to Course'
  requirements:
    _permission: 'create civicrm_event entities'

instructor_companion.education_console:
  path: '/admin/education'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\EducationConsoleController::build'
    _title: 'Education Console'
  requirements:
    _permission: 'access education console'
  options:
    _admin_route: TRUE

instructor_companion.workshop_proposal_queue:
  path: '/admin/workshop-proposals'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\WorkshopProposalQueueController::build'
    _title: 'Workshop Proposal Queue'
  requirements:
    _permission: 'access education console'

instructor_companion.instructor_interest_queue:
  path: '/admin/instructor-interest'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\InstructorInterestQueueController::build'
    _title: 'Instructor Interest Queue'
  requirements:
    _permission: 'access education console'

instructor_companion.event_reassign_execute:
  path: '/admin/structure/courses/reassign-event/{event_id}/{target_nid}'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\EventReassignController::reassign'
    _title: 'Moving Event'
  requirements:
    _permission: 'create civicrm_event entities'

instructor_companion.schedule_instance:
  path: '/admin/course/{node}/schedule-instance'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\ScheduleInstanceController::schedule'
    _title: 'Schedule New Instance'
  requirements:
    _custom_access: '\Drupal\instructor_companion\Controller\ScheduleInstanceController::access'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

instructor_companion.submission_status:
  path: '/admin/instructor-companion/submission/{submission}/status/{status}'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\SubmissionStatusController::setStatus'
  requirements:
    _permission: 'access education console'
    _csrf_token: 'TRUE'
    submission: '\d+'
    status: '[a-z0-9_]+'
  options:
    parameters:
      submission:
        type: 'entity:webform_submission'

instructor_companion.invite_form:
  path: '/admin/education/invite'
  defaults:
    _form: '\Drupal\instructor_companion\Form\InviteInstructorForm'
    _title: 'Invite an instructor'
  requirements:
    _permission: 'access education console'
  options:
    _admin_route: TRUE

instructor_companion.invite_resend:
  path: '/admin/education/invite/{user}/resend'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\InstructorInviteController::resend'
  options:
    parameters:
      user:
        type: entity:user
  requirements:
    _permission: 'access education console'
    _csrf_token: 'TRUE'
    user: \d+

instructor_companion.invite_accept:
  path: '/instructor/invite/{user}/{timestamp}/{hash}'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\InstructorInviteController::accept'
  options:
    parameters:
      user:
        type: entity:user
    no_cache: TRUE
  requirements:
    _access: 'TRUE'
    user: \d+
    timestamp: \d+

instructor_companion.closeout_remind:
  path: '/admin/education/closeout/{event_id}/remind'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\EducationConsoleController::remindCloseout'
  requirements:
    _permission: 'access education console'
    _csrf_token: 'TRUE'
    event_id: \d+
  options:
    _admin_route: TRUE

instructor_companion.older_closeout:
  path: '/admin/education/closeout/older'
  defaults:
    _controller: '\Drupal\instructor_companion\Controller\EducationConsoleController::olderCloseout'
    _title: 'Older outstanding classes'
  requirements:
    _permission: 'access education console'
  options:
    _admin_route: TRUE
