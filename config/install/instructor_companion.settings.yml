abandoned_subject: 'Your seat in [event_title] is still open'
abandoned_body: |
  Hi [first_name],

  You started registering for [event_title] ([event_date]) but the payment did not go through, so you are not yet on the list. A seat is still open.

  Finish your registration here:
  [register_url]

  If you changed your mind, no action is needed and this is the only reminder you will get. If something went wrong on the payment page, reply to this email and we will help.

  The MakeHaven Team
  www.makehaven.org
