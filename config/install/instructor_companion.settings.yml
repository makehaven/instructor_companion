instructor_welcome_enabled: true
instructor_welcome_subject: 'Welcome to MakeHaven Instructors'
instructor_welcome_body: |
  Hi [user:field_first_name],

  Thanks for stepping forward to teach at MakeHaven. Your instructor account is set up.

  You should have just been taken to the standard instructor agreement. If you didn't finish signing it, you can pick it back up here: [site:url]form/webform-5220

  Once we have your signed agreement, our education team will follow up to talk through which workshops you'd like to lead, scheduling, and compensation.

  Questions in the meantime? Write education@makehaven.org.

  The MakeHaven Team
  www.makehaven.org
interest_approval_enabled: true
interest_approval_subject: 'Next steps to become a MakeHaven instructor'
interest_approval_body: |
  Hi [submission:name],

  Thanks for telling us you'd like to teach at MakeHaven. We just reviewed your submission and would love to have you join our instructor community.

  Here are the next three steps. None of them require a paid membership — anyone can become a MakeHaven instructor.

  1. Watch the short instructor orientation video and complete the quiz:
     [site:url]video-instructor

  2. Sign the master instructor agreement (you'll be prompted after the quiz):
     [site:url]form/webform-5220

  3. Propose your first session. You can either pick from existing workshops that need an instructor, or propose a brand-new workshop of your own:
     [site:url]become-instructor/courses

  If you don't already have a MakeHaven account, you'll be prompted to create a free one on your first click.

  Questions? Reply to this email or write education@makehaven.org.

  Looking forward to working with you,
  The MakeHaven Education Team
  www.makehaven.org
