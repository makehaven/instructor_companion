instructor_welcome_enabled: true
instructor_welcome_subject: 'Welcome to MakeHaven Instructors'
instructor_welcome_body: |
  Hi [user:field_first_name],

  Thanks for stepping forward to teach at MakeHaven. Your account is set up.

  Next, tell us what you'd like to teach. If you're a member you can propose a session right away; if not, the short interest form is the place to start and the education team will follow up to talk through the class, scheduling and pay:
  [site:url]become-instructor

  Questions in the meantime? Write education@makehaven.org.

  The MakeHaven Team
  www.makehaven.org
interest_approval_enabled: true
interest_approval_subject: 'Next steps to become a MakeHaven instructor'
interest_approval_body: |
  Hi [submission:name],

  Thanks for telling us you'd like to teach at MakeHaven. We just reviewed your submission and would love to have you join our instructor community.

  The next step is to tell us what you'd like to teach. You don't need a paid membership — anyone can become a MakeHaven instructor.

  Propose a session. You can either pick from existing workshops that need an instructor, or propose a brand-new workshop of your own:
     [site:url]become-instructor/courses

  If you'd like to see what we look for in a workshop and an instructor first, that's here:
     [site:url]teach-workshop

  There's no paperwork at this stage. Once we've seen what you have in mind, one of us will get in touch to talk through the class, scheduling and pay. If it's a fit, we'll walk you through the last few steps then.

  If you don't already have a MakeHaven account, you'll be prompted to create a free one on your first click.

  Questions? Reply to this email or write education@makehaven.org.

  Looking forward to working with you,
  The MakeHaven Education Team
  www.makehaven.org
invite_subject: 'Your MakeHaven instructor agreement'
invite_body: |
  Hi [user:field_first_name],

  Great to have you teaching at MakeHaven. The last step before your first class is the instructor agreement — it takes about five minutes to read and sign.

  Sign it here (this link is yours alone and works for 14 days):
  [invite:link]

  [invite:note]

  Once you've signed, your instructor dashboard opens automatically — that's where your sessions, class checkout and post-class tasks live. If you're not already a MakeHaven member, we'll set up your building access after you sign.

  Questions? Reply to this email or write education@makehaven.org.

  [invite:sender]
  MakeHaven Education Team
  www.makehaven.org
