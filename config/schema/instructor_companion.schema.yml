instructor_companion.settings:
  type: config_object
  label: 'Instructor Companion settings'
  mapping:
    notification_email:
      type: email
      label: 'Instructor notification email'
    proposal_staff_contact_uid:
      type: integer
      label: 'Default staff contact user for member proposals'
    orientation_step_enabled:
      type: boolean
      label: 'Require the orientation video and quiz as part of onboarding'
    emergency_procedures_url:
      type: string
      label: 'Emergency procedures link'
    instructor_handbook_url:
      type: string
      label: 'Instructor handbook link'
    request_reimbursement_url:
      type: string
      label: 'Request reimbursement link'
    payment_status_url:
      type: string
      label: 'Payment status link'
    log_hours_url:
      type: string
      label: 'Log hours link'
    instructor_welcome_enabled:
      type: boolean
      label: 'Send instructor welcome email'
    instructor_welcome_subject:
      type: string
      label: 'Instructor welcome email subject'
    instructor_welcome_body:
      type: text
      label: 'Instructor welcome email body'
    invite_subject:
      type: string
      label: 'Instructor agreement invite email subject'
    invite_body:
      type: text
      label: 'Instructor agreement invite email body'
    closeout_event_types:
      type: sequence
      label: 'CiviCRM event types that owe post-class wrap-up'
      sequence:
        type: integer
        label: 'Event type id'
    attendance_prompt_enabled:
      type: boolean
      label: 'Ask the instructor for attendance at the start of the class'
    attendance_prompt_offset_minutes:
      type: integer
      label: 'Minutes after the start time before prompting for attendance'
