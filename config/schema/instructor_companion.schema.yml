instructor_companion.settings:
  type: config_object
  label: 'Instructor Companion settings'
  mapping:
    notification_email:
      type: email
      label: 'Instructor notification email'
    proposal_staff_contact_uid:
      type: integer
      label: 'Default staff contact user for member proposals'
    slack_channel:
      type: string
      label: 'Slack channel for education notices'
    orientation_step_enabled:
      type: boolean
      label: 'Require the orientation video and quiz as part of onboarding'
    emergency_procedures_url:
      type: string
      label: 'Emergency procedures link'
    instructor_handbook_url:
      type: string
      label: 'Instructor handbook link'
    request_reimbursement_url:
      type: string
      label: 'Request reimbursement link'
    payment_status_url:
      type: string
      label: 'Payment status link'
    log_hours_url:
      type: string
      label: 'Log hours link'
    instructor_welcome_enabled:
      type: boolean
      label: 'Send instructor welcome email'
    instructor_welcome_subject:
      type: string
      label: 'Instructor welcome email subject'
    instructor_welcome_body:
      type: text
      label: 'Instructor welcome email body'
    invite_subject:
      type: string
      label: 'Instructor agreement invite email subject'
    invite_body:
      type: text
      label: 'Instructor agreement invite email body'
    closeout_event_types:
      type: sequence
      label: 'CiviCRM event types that owe post-class wrap-up'
      sequence:
        type: integer
        label: 'Event type id'
    attendance_prompt_enabled:
      type: boolean
      label: 'Ask the instructor for attendance at the start of the class'
    attendance_prompt_offset_minutes:
      type: integer
      label: 'Minutes after the start time before prompting for attendance'
    follower_notice_enabled:
      type: boolean
      label: 'Email course followers when a new run of the course opens'
    session_evaluation_enabled:
      type: boolean
      label: 'Send the attendee evaluation for multi-session classes after the last session'
    session_evaluation_delay_hours:
      type: integer
      label: 'Hours after the last session before the evaluation is sent'
    default_event_length_minutes:
      type: integer
      label: 'Minutes given to an event saved without an end time'
    session_evaluation_subject:
      type: label
      label: 'Evaluation email subject'
    session_evaluation_body:
      type: text
      label: 'Evaluation email body'
    session_evaluation_url:
      type: string
      label: 'Evaluation link pattern'
    followup_enabled:
      type: boolean
      label: 'Send the post-class follow-up (join offer / badge nudge)'
    followup_delay_days:
      type: integer
      label: 'Days after the last session before the follow-up'
    followup_event_types:
      type: sequence
      label: 'CiviCRM event types whose attendees get the follow-up'
      sequence:
        type: integer
        label: 'Event type id'
    followup_join_url:
      type: string
      label: 'Join page path or URL'
    followup_tour_url:
      type: string
      label: 'Tour page path or URL'
    followup_join_subject:
      type: label
      label: 'Join offer subject'
    followup_join_body:
      type: text
      label: 'Join offer body'
    followup_badge_subject:
      type: label
      label: 'Badge nudge subject'
    followup_badge_body:
      type: text
      label: 'Badge nudge body'
    abandoned_followup_enabled:
      type: boolean
      label: 'Email a registration that stalled at payment'
    abandoned_after_hours:
      type: integer
      label: 'Hours after the attempt before the email'
    abandoned_subject:
      type: label
      label: 'Stalled registration subject'
    abandoned_body:
      type: text
      label: 'Stalled registration body'
    waitlist_offer_hours:
      type: integer
      label: 'Hours an unpaid waitlist offer stays open (0 = leave events alone)'
    cloned_reminder_titles:
      type: sequence
      label: 'Per-event reminder titles switched off after a CiviCRM copy'
      sequence:
        type: string
        label: 'Title'
    profile_nudge_subject:
      type: label
      label: 'Incomplete instructor profile nudge subject'
    profile_nudge_body:
      type: text
      label: 'Incomplete instructor profile nudge body'
